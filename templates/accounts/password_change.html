{% extends "accounts/login.html" %}
{% block title %}Đổi mật khẩu | Cake Crush{% endblock %}
{% block body %}<main class="cc-auth-main"><section class="cc-panel cc-auth-card"><h1>Đổi mật khẩu</h1><form method="post">{% csrf_token %}
{% if form.errors %}<div class="cc-form-error" role="alert">{{ form.errors }}</div>{% endif %}
<label class="cc-field">Mật khẩu hiện tại<input name="old_password" type="password" autocomplete="current-password" required autofocus></label>
<label class="cc-field">Mật khẩu mới<input name="new_password1" type="password" autocomplete="new-password" required></label>
<label class="cc-field">Nhập lại mật khẩu mới<input name="new_password2" type="password" autocomplete="new-password" required></label>
<p class="cc-auth-hint">Mật khẩu phải có ít nhất 8 ký tự, không chỉ gồm số hoặc quá dễ đoán.</p>
<div class="cc-form-actions"><a class="cc-button cc-button-secondary" href="{% url 'employees:my_profile' %}">Quay lại</a><button class="cc-button cc-button-primary" type="submit">Lưu mật khẩu</button></div>
</form></section></main>{% endblock %}
